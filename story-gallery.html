<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Emberforge story gallery</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14111f; color: #e8e0d0; font-family: sans-serif; }
      #gallery { display: flex; height: 100%; position: relative; }
      #story-list { width: 280px; overflow-y: auto; padding: 8px; box-sizing: border-box; background: #1d1830; }
      #story-list h3 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; color: #c8a24a; }
      #story-list button { display: block; width: 100%; margin: 2px 0; padding: 5px 8px; text-align: left; background: #2c2547; color: inherit; border: 1px solid #4a3f75; cursor: pointer; font-size: 12px; }
      #story-list button.selected { background: #6a4aa8; }
      #language-row button { display: inline-block; width: auto; margin-right: 4px; }
      #reader { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 24px; }
      #reader h2 { margin: 0 0 4px; color: #c8a24a; }
      #reader .kind { margin: 0 0 12px; font-size: 12px; color: #9a90b8; }
      #reader p { max-width: 720px; line-height: 1.5; }
      #reader p.ember { color: #f2c14e; font-style: italic; }
      #reader .page-number { color: #9a90b8; font-size: 12px; margin-right: 6px; }
      #open-in-game { margin: 0 0 12px; padding: 6px 12px; background: #6a4aa8; color: inherit; border: 1px solid #4a3f75; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="gallery">
      <div id="story-list"></div>
      <div id="reader">Pick a story on the left.</div>
    </div>
    <script type="module" src="/tools/story-gallery/main.ts"></script>
  </body>
</html>
