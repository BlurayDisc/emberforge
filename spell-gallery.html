<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Emberforge spell gallery</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14111f; color: #e8e0d0; font-family: sans-serif; }
      #gallery { display: flex; height: 100%; }
      #spell-list { width: 250px; overflow-y: auto; padding: 8px; box-sizing: border-box; background: #1d1830; }
      #spell-list h3 { margin: 10px 0 4px; font-size: 13px; text-transform: uppercase; color: #c8a24a; }
      #spell-list button { display: block; width: 100%; margin: 2px 0; padding: 5px 8px; text-align: left; background: #2c2547; color: inherit; border: 1px solid #4a3f75; cursor: pointer; font-size: 12px; }
      #spell-list button.playing { background: #6a4aa8; }
      #stage-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #stage-host { flex: 1; min-height: 0; position: relative; }
      #caption { padding: 8px 12px; font-size: 14px; background: #1d1830; }
      #caption b { color: #c8a24a; }
    </style>
  </head>
  <body>
    <div id="gallery">
      <div id="spell-list"></div>
      <div id="stage-column">
        <div id="stage-host" class="stage-canvas-host"></div>
        <div id="caption">Pick a spell, or press Play all.</div>
      </div>
    </div>
    <script type="module" src="/tools/spell-gallery/main.ts"></script>
  </body>
</html>
